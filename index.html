<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Yashii! 🎀</title>
    <style>
        :root {
            --primary-pink: #FFB7C5;
            --dark-pink: #FF6699;
            --bg-light: #FFF0F5;
            --accent-gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #4A4A4A;
            overflow-x: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Password Overlay Screen */
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
            transition: opacity 0.5s ease-out;
        }

        .lock-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border: 4px solid var(--primary-pink);
            border-radius: 24px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(255, 183, 197, 0.4);
        }

        .lock-container h2 {
            color: var(--dark-pink);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .lock-container input {
            width: 80%;
            padding: 12px;
            font-size: 1.5rem;
            letter-spacing: 5px;
            text-align: center;
            border: 2px solid var(--primary-pink);
            border-radius: 12px;
            outline: none;
            margin-bottom: 15px;
            color: var(--dark-pink);
        }

        .lock-container input:focus {
            border-color: var(--dark-pink);
        }

        .error-msg {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 10px;
            display: none;
        }

        /* Main Site Content (Hidden initially) */
        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border: 4px solid var(--primary-pink);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(255, 183, 197, 0.4);
            position: relative;
            margin-top: 10px;
            display: none; /* Shows after correct password */
        }

        .bow-icon {
            font-size: 50px;
            color: var(--dark-pink);
            animation: pulse 2s infinite;
        }

        h1 {
            color: var(--dark-pink);
            font-size: 2.2rem;
            margin: 15px 0;
            text-shadow: 2px 2px 0px #FFE4E1;
        }

        .message-box {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 25px;
            background: #FFF9FA;
            padding: 15px;
            border-radius: 15px;
            border: 1px dashed var(--primary-pink);
        }

        /* Photo Gallery Styling */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .gallery img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid var(--primary-pink);
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .btn {
            background-color: var(--dark-pink);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 102, 153, 0.3);
            transition: transform 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 12px;
            height: 12px;
            z-index: 999;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Locked Screen -->
    <div id="lock-screen">
        <div class="lock-container">
            <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
            <h2>Enter the Secret Code to Unlock</h2>
            <input type="password" id="passwordInput" placeholder="••••" maxlength="4" pattern="\d*">
            <div class="error-msg" id="errorMsg">Oops! Wrong code, try again. 💕</div>
            <button class="btn" onclick="checkPassword()">Unlock</button>
        </div>
    </div>

    <!-- Birthday Main Page -->
    <div class="container" id="main-content">
        <div class="bow-icon">🎀</div>
        <h1>Happy Birthday, Yashii! 💕</h1>
        
        <div class="message-box">
            Wishing the most amazing girl the absolute best day ever! You deserve all the joy, sparkles, and happiness in the world. Thank you for being you. HBD! 🎉
        </div>

        <div class="gallery">
            <img src="photo1.jpg" alt="Yashii 1">
            <img src="photo2.jpg" alt="Yashii 2">
            <img src="photo3.jpg" alt="Yashii 3">
        </div>

        <button class="btn" onclick="makeConfetti()">Tap for more Sparkles! 🌸</button>
    </div>

    <script>
        // Password Verification Logic
        function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const error = document.getElementById('errorMsg');
            const lockScreen = document.getElementById('lock-screen');
            const mainContent = document.getElementById('main-content');

            if (input === '0909') {
                lockScreen.style.opacity = '0';
                setTimeout(() => {
                    lockScreen.style.display = 'none';
                    mainContent.style.display = 'block';
                    makeConfetti(); // Fire confetti automatically on unlock!
                }, 500);
            } else {
                error.style.display = 'block';
                document.getElementById('passwordInput').value = '';
            }
        }

        // Support pressing Enter key on the input box
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // Confetti Engine
        function makeConfetti() {
            const colors = ['#FFB7C5', '#FF6699', '#FFD700', '#FFFFFF'];
            for (let i = 0; i < 45; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = (window.scrollY - 10) + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.opacity = Math.random();
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0px';
                document.body.appendChild(confetti);

                setTimeout(() => {
                    confetti.remove();
                }, 4000);
            }
        }
    </script>
</body>
</html>
